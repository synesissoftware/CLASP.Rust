
# ##########################################################
# Package

[package]

authors = [
	"Matt Wilson <matthew@synesis.com.au>",
]
categories = [
	"command-line-interface",
]
description = "Command-Line Argument Sorting and Parsing (for Rust)"
documentation = "https://docs.rs/clasp-rs"
edition = "2021"
exclude = [
	".cargo",
	".cursor",
	".github",
	".vimrc",
	".vscode",
	"scripts",
	"target",
	"test/conformance/local",
	"test/conformance/shared",
]
homepage = "https://github.com/synesissoftware/CLASP.Rust"
keywords = [
	"cli",
	"command-line",
	"options",
	"parsing",
]
license = "BSD-3-Clause"
name = "clasp-rs"
readme = "README.md"
repository = "https://github.com/synesissoftware/CLASP.Rust"
rust-version = "1.74"
version = "0.1.0"


# ##########################################################
# Targets

[lib]
name = "clasp_rs"
path = "src/lib.rs"

[[example]]
name = "minimal-usage"
path = "examples/minimal-usage/main.rs"

[[example]]
name = "versions"
path = "examples/versions/main.rs"

[[test]]
name = "conformance"
path = "test/conformance/main.rs"

[[test]]
name = "unit"
path = "test/unit/main.rs"


# ##########################################################
# Features

[features]

default = [
]

# General features:
#
# - "_NEVER_TO_BE_ENABLED" - this is a placeholder feature and must NEVER be specified;
# - "null-feature" - a feature that has no effect (and, thus, is useful for simplifying driver scripts);

_NEVER_TO_BE_ENABLED = []
null-feature = []


# Crate-specific features:
#


# ##########################################################
# Dependencies

[build-dependencies]

[dependencies]

base-traits = { version = "0.2", default-features = false, features = [
]}


[dev-dependencies]

serde_json = { version = "1", default-features = false, features = [
	"std",
]}
test_help-rs = { version = "0.2", default-features = false, features = [
]}
woad = { version = "0", default-features = false, features = [
]}



# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

